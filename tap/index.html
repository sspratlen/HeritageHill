<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heritage Hill Church</title>
  <link rel="icon" href="../assets/pwa/icon-192.png?v=2" />
  <meta name="theme-color" content="#BC7A1E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg,#F4F4F2); font-family:'DM Sans',sans-serif; }
    .tap-wrap { text-align:center; }
    .tap-logo-badge { width:96px; height:96px; margin:0 auto 20px; border-radius:50%; background:#3A3A3C; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(0,0,0,.15); }
    .tap-logo { width:60px; height:60px; object-fit:contain; }
    .tap-spinner { width:28px; height:28px; border:3px solid rgba(188,122,30,.25); border-top-color:var(--primary,#BC7A1E); border-radius:50%; margin:0 auto 16px; animation:tap-spin .8s linear infinite; }
    @keyframes tap-spin { to { transform:rotate(360deg); } }
    .tap-msg { color:var(--text-muted,#6B6B6B); font-size:.95rem; }
  </style>
</head>
<body>
  <div class="tap-wrap">
    <div class="tap-logo-badge">
      <img class="tap-logo" src="../assets/pwa/icon-192.png?v=2" alt="Heritage Hill Church" onerror="this.parentElement.style.display='none'" />
    </div>
    <div class="tap-spinner"></div>
    <p class="tap-msg">Taking you there&hellip;</p>
  </div>
  <script src="../js/supabase-client.js"></script>
  <script>
    (function () {
      const section = new URLSearchParams(location.search).get('section');
      if (!section) { location.replace('../'); return; }
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      fetch(`${SUPABASE_URL}/functions/v1/tap-redirect?section=${encodeURIComponent(section)}&format=json`, { signal: controller.signal })
        .then(r => r.json())
        .then(data => { clearTimeout(timeout); location.replace(data.url || '../'); })
        .catch(() => { clearTimeout(timeout); location.replace('../'); });
    })();
  </script>
</body>
</html>
